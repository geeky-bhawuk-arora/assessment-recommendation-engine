<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHL Assessment Recommendation Engine</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container py-5">
    <div class="text-center mb-4">
      <h2>SHL Assessment Recommendation Engine</h2>
      <p class="text-muted">Enter a job description or query to find the most relevant SHL assessments</p>
    </div>

    <form method="POST" class="card p-4 shadow-sm">
      <label for="job_desc" class="form-label fw-bold">Job Description / Query:</label>
      <textarea name="job_desc" id="job_desc" class="form-control" rows="4" placeholder="e.g. Looking for a software engineer with strong analytical and teamwork skills" required></textarea>
      <button type="submit" class="btn btn-primary mt-3">Get Recommendations</button>
    </form>
  </div>
</body>
</html>
